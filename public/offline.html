<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're Offline – In Our Budget</title>
  <meta name="theme-color" content="#0b0607" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f0f0f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #171717;
      border: 1px solid #262626;
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .logo-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #262626;
      padding: 8px 16px;
      border-radius: 9999px;
      border: 1px solid #333;
    }
    .logo-badge img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }
    .logo-badge span {
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.5px;
      color: #FF5A00;
      text-transform: uppercase;
    }
    .icon-container {
      width: 80px;
      height: 80px;
      background: rgba(255, 90, 0, 0.1);
      border: 1px solid rgba(255, 90, 0, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FF5A00;
      margin-top: 10px;
    }
    .icon-container svg {
      width: 40px;
      height: 40px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      margin-top: 4px;
    }
    p {
      font-size: 14px;
      color: #a3a3a3;
      line-height: 1.6;
    }
    .btn {
      background: #FF5A00;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(255, 90, 0, 0.3);
    }
    .btn:hover {
      background: #e04f00;
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .footer-text {
      font-size: 12px;
      color: #525252;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">
      <img src="/logo.png" alt="In Our Budget" />
      <span>IN OUR BUDGET</span>
    </div>

    <div class="icon-container">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-12.728 0m0 0l2.829-2.829m-2.829 2.829L3 21M8.464 15.536a5 5 0 010-7.072m0 0l2.829 2.829M12 12v.01" />
      </svg>
    </div>

    <div>
      <h1>You're Offline</h1>
      <p>Please check your internet connection and try again.</p>
    </div>

    <button class="btn" onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      Try Again
    </button>

    <div class="footer-text">
      In Our Budget &copy; Saved offline copy will re-sync when online.
    </div>
  </div>
</body>
</html>
